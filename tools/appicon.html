<!doctype html>
<!-- 앱 아이콘 디자인 — tools/gen-appicon.js가 이 페이지를 1024×1024로 캡처한다 -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    position: relative;
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: linear-gradient(160deg, #f0d795 0%, #e8ce86 45%, #d9b96a 100%);
  }

  /* 은은한 보드 격자 */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(120, 90, 40, 0.10) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(120, 90, 40, 0.10) 1.5px, transparent 1.5px);
    background-size: 93px 93px;
    background-position: 47px 47px;
  }

  /* 초원 다이아몬드 + 오아시스 (우상단, 목표 지점) */
  .meadow {
    position: absolute;
    right: 118px;
    top: 118px;
    width: 340px;
    height: 340px;
    transform: rotate(45deg);
    border-radius: 44px;
    background: #8fb36a;
    box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.14);
  }
  .oasis {
    position: absolute;
    right: 218px;
    top: 218px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #7ac1d0 0 26%, #3b93a5 62%, #2e7d8e 100%);
    box-shadow: 0 6px 18px rgba(40, 90, 100, 0.35);
  }

  /* 질주 자국 (말 뒤의 속도선) */
  .trail {
    position: absolute;
    height: 26px;
    border-radius: 13px;
    background: rgba(120, 85, 40, 0.28);
  }
  .t1 { left: 60px; bottom: 430px; width: 210px; }
  .t2 { left: 40px; bottom: 360px; width: 150px; }
  .t3 { left: 80px; bottom: 290px; width: 90px; }

  /* 말 — 체스 나이트 글리프 */
  .horse {
    position: absolute;
    left: 50%;
    bottom: -78px;
    transform: translateX(-52%);
    font-family: "DejaVu Sans", "Noto Sans Symbols 2", sans-serif;
    font-size: 900px;
    line-height: 1;
    color: #462c18;
    text-shadow: 0 18px 40px rgba(60, 35, 15, 0.45);
  }
</style>
<div class="icon">
  <div class="grid"></div>
  <div class="meadow"></div>
  <div class="oasis"></div>
  <div class="trail t1"></div>
  <div class="trail t2"></div>
  <div class="trail t3"></div>
  <div class="horse">♞</div>
</div>
