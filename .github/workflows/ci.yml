name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # JS 룰 엔진 (레퍼런스 구현) 테스트 + 웹 번들 빌드
  engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 룰 엔진 단위 테스트
        run: npm test
      - name: 웹 번들 빌드
        run: npm run build:web
      - name: 밸런스 스모크 (5게임, 깊이 2)
        run: node tools/simulate.js 5 2 1

  # iOS 앱 빌드 검증 (서명 없이 시뮬레이터용 컴파일만)
  ios-build-check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 최신 Xcode 선택
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"
      - name: 컴파일 (시뮬레이터, 서명 생략)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RunHorses.xcodeproj \
            -scheme RunHorses \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -50

  # 2인용 릴레이 서버 테스트
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm test
        working-directory: server
