name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 룰 엔진 단위 테스트
        run: npm test
      - name: 웹 번들 빌드
        run: npm run build:web
      - name: 밸런스 스모크 (5게임, 깊이 2)
        run: node tools/simulate.js 5 2 1
